name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: npm ci

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'FlowBox v__VERSION__'
          releaseBody: |
            查看本次更新内容，已安装桌面端的用户可直接在「设置 → 关于 FlowBox」中一键自动更新。

            > **macOS 首次下载 DMG 安装提示**：因开源应用未购买 Apple 付费公证，首次从浏览器下载安装若提示「“FlowBox”已损坏，无法打开」，请先拖入「应用程序」后在终端运行一次：
            > ```bash
            > xattr -cr /Applications/FlowBox.app
            > ```
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
