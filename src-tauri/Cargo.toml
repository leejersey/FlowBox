[package]
name = "flowbox"
version = "0.5.0"
description = "FlowBox桌面端 — AI 提效工具箱"
authors = ["FlowBox Team"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
arboard = "3"
tauri-plugin-global-shortcut = "2"
base64 = "0.22"
cpal = "0.15"
hound = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
tauri-plugin-autostart = "2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSDictionary", "NSString", "NSURL"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSImage"] }
